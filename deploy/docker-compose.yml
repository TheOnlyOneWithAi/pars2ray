name: pars2ray

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pars2ray
      POSTGRES_USER: pars2ray
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set; run deploy/install.sh}
    volumes:
      - pars2ray_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pars2ray -d pars2ray"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [pars2ray]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - pars2ray_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
    networks: [pars2ray]

  master:
    image: pars2ray-master:local
    build:
      context: ..
      dockerfile: master/Dockerfile
      network: host
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://pars2ray:${POSTGRES_PASSWORD}@db:5432/pars2ray?connect_timeout=5
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${PANEL_HTTP_PORT:-8000}:8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp
    networks: [pars2ray]

  worker:
    image: pars2ray-master:local
    restart: unless-stopped
    command: ["./scripts/start-worker.sh"]
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://pars2ray:${POSTGRES_PASSWORD}@db:5432/pars2ray?connect_timeout=5
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      master: {condition: service_healthy}
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp
    networks: [pars2ray]

volumes:
  pars2ray_db:
  pars2ray_redis:

networks:
  pars2ray:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${PARS2RAY_NETWORK_SUBNET:-10.250.0.0/24}
