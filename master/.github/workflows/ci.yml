name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONPATH: master
  ENVIRONMENT: development
  JWT_SECRET: ci-test-jwt-secret-012345678901234567890123
  MASTER_SECRET: ci-test-master-secret-012345678901234567890123
  ADMIN_PASSWORD: ci-test-admin-password

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r master/requirements.txt
          pip install pytest ruff
      - name: Lint
        run: ruff check master/app master/tests
      - name: Compile
        run: python -m compileall -q master/app master/tests
      - name: Tests
        run: pytest -q master/tests
