name: Build frontend static assets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify production bundle
        run: |
          test -s master/app/static/index.html
          test -d master/app/static/assets
          test "$(find master/app/static/assets -type f | wc -l)" -gt 0
          grep -q '<div id="root"></div>' master/app/static/index.html

      - name: Publish production bundle on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f master/app/static
          if git diff --cached --quiet; then
            echo "Static bundle is already up to date."
            exit 0
          fi
          git commit -m "build(frontend): publish production static bundle [skip ci]"
          git push origin HEAD:main

      - name: Verify pull request bundle
        if: github.event_name == 'pull_request'
        run: git status --short master/app/static
