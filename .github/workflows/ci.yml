name: Pars2Ray CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pars2ray-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            master/requirements.txt
            agent/requirements.txt
            installer/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r master/requirements.txt
          pip install -r agent/requirements.txt
          pip install -r installer/requirements.txt
          pip install pytest pytest-asyncio ruff alembic
      - name: Verify dependency consistency
        run: pip check
      - name: Compile Python sources
        run: python -m compileall -q master/app master/tests agent/app agent/tests installer scripts tests
      - name: Lint Python sources
        run: ruff check master/app master/tests agent/app agent/tests installer scripts tests
      - name: Run master tests
        working-directory: master
        env:
          PYTHONPATH: ${{ github.workspace }}/master
          ENVIRONMENT: test
          DATABASE_URL: sqlite:////tmp/pars2ray-ci.db
          JWT_SECRET: ci-jwt-secret-at-least-32-characters
          MASTER_SECRET: ci-master-secret-at-least-32-characters
          ADMIN_PASSWORD: ci-admin-password
        run: pytest -q tests
      - name: Run agent tests
        working-directory: agent
        env:
          PYTHONPATH: ${{ github.workspace }}/agent
          ENVIRONMENT: test
        run: pytest -q tests
      - name: Run repository tests
        env:
          PYTHONPATH: ${{ github.workspace }}/master
          ENVIRONMENT: test
          DATABASE_URL: sqlite:////tmp/pars2ray-ci-repo.db
          JWT_SECRET: ci-jwt-secret-at-least-32-characters
          MASTER_SECRET: ci-master-secret-at-least-32-characters
          ADMIN_PASSWORD: ci-admin-password
        run: pytest -q tests

  installer:
    name: Native Installer validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: installer/requirements.txt
      - name: Install installer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r installer/requirements.txt
      - name: Compile installer
        run: python -m compileall -q installer
      - name: Validate installer imports
        run: python -c "import installer.bootstrap; import installer.discover_nodes; import installer.generate_env"
      - name: Validate Native Installer syntax
        run: bash -n deploy/install.sh deploy/scripts/native-backup.sh deploy/scripts/native-restore.sh deploy/scripts/rollback.sh
      - name: ShellCheck deployment scripts
        run: shellcheck -x -S error deploy/install.sh deploy/scripts/*.sh
      - name: Validate APT mirror policy
        run: |
          ! grep -Rni 'mirror\.iranserver\.com' deploy installer
          grep -q 'https://archive\.ubuntu\.com/ubuntu' deploy/install.sh
          grep -q 'https://security\.ubuntu\.com/ubuntu' deploy/install.sh
      - name: Validate installer files
        run: |
          test -s deploy/install.sh
          test -s installer/requirements.txt
          test -s master/requirements.txt

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  security:
    name: Dependency and static security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security tools
        run: python -m pip install --upgrade pip pip-audit bandit
      - name: Verify direct dependency pins
        run: python scripts/check_dependency_pins.py
      - name: Audit master dependencies
        run: pip-audit -r master/requirements.txt
      - name: Audit agent dependencies
        run: pip-audit -r agent/requirements.txt
      - name: Audit installer dependencies
        run: pip-audit -r installer/requirements.txt
      - name: Bandit security scan
        run: bandit -r master/app agent/app installer -ll
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  release-gates:
    name: E2E, migrations, backup/restore and rollback gates
    runs-on: ubuntu-latest
    needs: [backend, installer, frontend, security]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r master/requirements.txt pytest pytest-asyncio ruff alembic
      - name: Run release gate tests
        env:
          PYTHONPATH: ${{ github.workspace }}/master
          ENVIRONMENT: test
          DATABASE_URL: sqlite:////tmp/pars2ray-release.db
          JWT_SECRET: ci-jwt-secret-at-least-32-characters
          MASTER_SECRET: ci-master-secret-at-least-32-characters
          ADMIN_PASSWORD: ci-admin-password
        run: pytest -q tests/test_release_gates.py tests/test_e2e_smoke.py
      - name: Migration upgrade/downgrade/upgrade smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}/master
          ENVIRONMENT: test
          DATABASE_URL: sqlite:////tmp/pars2ray-migration.db
          JWT_SECRET: ci-jwt-secret-at-least-32-characters
          MASTER_SECRET: ci-master-secret-at-least-32-characters
          ADMIN_PASSWORD: ci-admin-password
        run: |
          rm -f /tmp/pars2ray-migration.db
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Native backup/restore executable smoke test
        run: |
          test -x deploy/scripts/native-backup.sh || chmod +x deploy/scripts/native-backup.sh
          test -x deploy/scripts/native-restore.sh || chmod +x deploy/scripts/native-restore.sh
          test -x deploy/scripts/rollback.sh || chmod +x deploy/scripts/rollback.sh
          bash -n deploy/scripts/native-backup.sh deploy/scripts/native-restore.sh deploy/scripts/rollback.sh
      - name: Installer upgrade contract test
        run: |
          grep -q 'Existing installation detected; keeping panel credentials and settings' deploy/install.sh
          grep -q 'git -C "$INSTALL_DIR" fetch --depth 1 origin "$REF"' deploy/install.sh
          grep -q 'git -C "$INSTALL_DIR" reset --hard "origin/$REF"' deploy/install.sh
      - name: Rollback safety contract test
        run: |
          grep -q 'working tree is dirty; refusing rollback' deploy/scripts/rollback.sh
          grep -q 'rev-parse --verify' deploy/scripts/rollback.sh
          grep -q 'systemctl restart pars2ray-master pars2ray-worker' deploy/scripts/rollback.sh

# All release gates must pass before CI is considered green.
