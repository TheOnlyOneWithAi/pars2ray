name: Pars2Ray CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pars2ray-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            master/requirements.txt
            agent/requirements.txt
            installer/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r master/requirements.txt
          pip install -r agent/requirements.txt
          pip install -r installer/requirements.txt
          pip install pytest pytest-asyncio ruff
      - name: Verify dependency consistency
        run: pip check
      - name: Compile Python sources
        run: python -m compileall -q master/app agent/app installer scripts
      - name: Lint Python sources
        run: ruff check master/app agent/app installer scripts
      - name: Run master tests
        working-directory: master
        env:
          PYTHONPATH: ${{ github.workspace }}/master
          ENVIRONMENT: test
          DATABASE_URL: sqlite:////tmp/pars2ray-ci.db
          JWT_SECRET: ci-jwt-secret-at-least-32-characters
          MASTER_SECRET: ci-master-secret-at-least-32-characters
          ADMIN_PASSWORD: ci-admin-password
        run: pytest -q tests
      - name: Run agent tests
        working-directory: agent
        env:
          PYTHONPATH: ${{ github.workspace }}/agent
          ENVIRONMENT: test
        run: pytest -q tests
      - name: Run repository tests
        env:
          PYTHONPATH: ${{ github.workspace }}/master
          ENVIRONMENT: test
          DATABASE_URL: sqlite:////tmp/pars2ray-ci-repo.db
          JWT_SECRET: ci-jwt-secret-at-least-32-characters
          MASTER_SECRET: ci-master-secret-at-least-32-characters
          ADMIN_PASSWORD: ci-admin-password
        run: |
          if [ -d tests ] && find tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            pytest -q tests
          else
            echo "No repository-level tests found."
          fi

  installer:
    name: Installer validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: installer/requirements.txt
      - name: Install installer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r installer/requirements.txt
      - name: Compile installer
        run: python -m compileall -q installer
      - name: Validate installer imports
        run: python -c "import installer.bootstrap; import installer.discover_nodes; import installer.generate_env"
      - name: Validate Native Installer syntax
        run: bash -n deploy/install.sh

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  compose:
    name: Legacy Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare legacy CI environment
        run: |
          cp .env.example .env
          {
            echo 'POSTGRES_PASSWORD=ci-postgres-password'
            echo 'DATABASE_URL=postgresql+psycopg://pars2ray:ci-postgres-password@db:5432/pars2ray'
            echo 'REDIS_URL=redis://redis:6379/0'
          } >> .env
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=ci-jwt-secret-at-least-32-characters/' .env
          sed -i 's/^MASTER_SECRET=.*/MASTER_SECRET=ci-master-secret-at-least-32-characters/' .env
          sed -i 's/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=ci-admin-password/' .env
      - name: Validate Compose configuration
        run: docker compose --env-file .env -f deploy/docker-compose.yml config --quiet

  security:
    name: Dependency and static security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security tools
        run: python -m pip install --upgrade pip pip-audit bandit
      - name: Verify direct dependency pins
        run: python scripts/check_dependency_pins.py
      - name: Audit Python dependencies
        run: |
          pip-audit -r master/requirements.txt -r agent/requirements.txt -r installer/requirements.txt
      - name: Bandit security scan
        run: bandit -r master/app agent/app installer -ll
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Legacy Compose end-to-end smoke
    runs-on: ubuntu-latest
    needs: [compose, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare legacy CI environment
        run: |
          cp .env.example .env
          {
            echo 'POSTGRES_PASSWORD=ci-postgres-password'
            echo 'DATABASE_URL=postgresql+psycopg://pars2ray:ci-postgres-password@db:5432/pars2ray'
            echo 'REDIS_URL=redis://redis:6379/0'
          } >> .env
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=ci-jwt-secret-at-least-32-characters/' .env
          sed -i 's/^MASTER_SECRET=.*/MASTER_SECRET=ci-master-secret-at-least-32-characters/' .env
          sed -i 's/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=ci-admin-password/' .env
          sed -i 's/^ADMIN_USER=.*/ADMIN_USER=admin/' .env
          sed -i 's/^PANEL_HTTP_PORT=.*/PANEL_HTTP_PORT=8000/' .env
      - name: Build and start legacy production stack
        run: docker compose --env-file .env -f deploy/docker-compose.yml up -d --build db redis master
      - name: Wait for Master
        run: |
          for i in $(seq 1 60); do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"; then exit 0; fi
            sleep 2
          done
          docker compose --env-file .env -f deploy/docker-compose.yml logs master
          exit 1
      - name: Run E2E smoke
        env:
          ADMIN_USER: admin
          ADMIN_PASSWORD: ci-admin-password
          PARS2RAY_E2E_URL: http://127.0.0.1:8000
        run: python scripts/e2e_smoke.py
      - name: Collect service logs
        if: always()
        run: docker compose --env-file .env -f deploy/docker-compose.yml logs --no-color master db redis
